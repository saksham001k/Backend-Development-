name: L44-L45 Backend API Tests

on:
  push:
    branches: [main]
    paths:
      - 'Theory/Unit4/L44-L45/**'
      - '.github/workflows/backend-api-tests.yml'
  pull_request:
    paths:
      - 'Theory/Unit4/L44-L45/**'
      - '.github/workflows/backend-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Theory/Unit4/L44-L45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run server and HTTP tests
        run: |
          python -m uvicorn apiserver:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat server.log' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=1) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          python testAutomation.py
          python -m pytest automation_test_pytest.py -v

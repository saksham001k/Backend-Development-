<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>My Notes</h1>
        <p>Notes are saved in the browser using localStorage.</p>
        <form id="noteForm">
            <input id="noteInput" placeholder="Type a note..." maxlength="150" required>
            <button>Add Note</button>
        </form>
        <input id="searchInput" placeholder="Search notes...">
        <div id="notesList"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>

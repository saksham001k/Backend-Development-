services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: local-wp-only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u wpuser -p\"$$MYSQL_PASSWORD\" wordpress -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "127.0.0.1:8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: local-wp-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_content:/var/www/html/wp-content
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  wp_content:

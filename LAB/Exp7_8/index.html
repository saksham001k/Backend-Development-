<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ES6 To-Do App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script type="module" src="demo.js"></script>
</head>
<body>
  <main>
    <h1>My To-Do List</h1>
    <p>Experiment 7 &amp; 8: ES6, DOM and events.</p>
    <form id="taskForm">
      <label for="taskInput">Task title</label>
      <div class="input-row">
        <input id="taskInput" type="text" placeholder="Enter a task" required>
        <button type="submit">Add</button>
      </div>
    </form>
    <p id="taskCount" aria-live="polite">0 tasks</p>
    <p>Click a task title to mark it complete or incomplete.</p>
    <ul id="taskList"></ul>
  </main>
  <footer>Saksham Katiyar · SAP ID: 590015169</footer>
</body>
</html>

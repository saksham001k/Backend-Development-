<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Responsive Page</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <nav class="bg-blue-800 text-white"><div class="max-w-6xl mx-auto p-4 flex flex-col sm:flex-row justify-between"><strong>Backend Hub</strong><div class="space-x-4"><a href="#topics">Topics</a><a href="#contact">Contact</a></div></div></nav>
    <header class="max-w-6xl mx-auto px-4 py-14 grid md:grid-cols-2 gap-8 items-center"><div><h1 class="text-4xl font-bold">Build Better Backends</h1><p class="mt-3 text-lg">Responsive design made with Tailwind CSS utilities.</p></div><div class="bg-white border rounded-xl p-12 text-center shadow-sm">Utility-first responsive grid</div></header>
    <main id="topics" class="max-w-6xl mx-auto px-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-4"><article class="bg-white p-5 rounded shadow"><h2 class="font-bold">Node.js</h2><p>Server-side JavaScript.</p></article><article class="bg-white p-5 rounded shadow"><h2 class="font-bold">Express</h2><p>Routes and middleware.</p></article><article class="bg-white p-5 rounded shadow"><h2 class="font-bold">FastAPI</h2><p>Python API framework.</p></article><article class="bg-white p-5 rounded shadow"><h2 class="font-bold">EJS</h2><p>Dynamic HTML templates.</p></article></main>
    <section id="contact" class="max-w-3xl mx-auto px-4 py-12"><h2 class="text-2xl font-bold mb-4">Contact</h2><form><label class="block mb-1" for="tname">Name</label><input class="w-full border rounded px-3 py-2 mb-3" id="tname" required><label class="block mb-1" for="temail">Email</label><input class="w-full border rounded px-3 py-2 mb-3" type="email" id="temail" required><button class="bg-green-600 text-white px-5 py-2 rounded">Submit</button></form></section>
</body>
</html>

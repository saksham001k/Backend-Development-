<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Responsive Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="#">Backend Hub</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="menu"><div class="navbar-nav ms-auto"><a class="nav-link" href="#topics">Topics</a><a class="nav-link" href="#contact">Contact</a></div></div></div>
    </nav>
    <header class="container py-5"><div class="row align-items-center g-4"><div class="col-md-6"><h1>Build Better Backends</h1><p class="lead">Responsive design made with Bootstrap.</p><a class="btn btn-primary" href="#topics">Explore</a></div><div class="col-md-6"><div class="bg-light border rounded p-5 text-center">12-column responsive grid</div></div></div></header>
    <main class="container" id="topics"><div class="row g-3"><div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body"><h2 class="h5">Node.js</h2><p>Server-side JavaScript.</p></div></div></div><div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body"><h2 class="h5">Express</h2><p>Routes and middleware.</p></div></div></div><div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body"><h2 class="h5">FastAPI</h2><p>Python API framework.</p></div></div></div><div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body"><h2 class="h5">EJS</h2><p>Dynamic HTML templates.</p></div></div></div></div></main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
